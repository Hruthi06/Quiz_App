services:
  - type: web
    name: quiz-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  - type: web
    name: quiz-frontend
    env: node
    buildCommand: "cd quiz-frontend && npm install && npm run build"
    startCommand: "cd quiz-frontend && npm install -g serve && serve -s build"
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: quiz-backend
          property: host
